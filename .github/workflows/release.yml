name: release

# Manual only: nothing here runs on a push, a tag or a schedule. Start it from
# Actions -> release -> Run workflow, on main.
#
# One run is the whole release: it sets the version everywhere, regenerates what is
# derived from it, verifies, commits and tags, publishes the four public packages to
# npm, and creates the GitHub release from the changelog. With dry_run on (the default)
# it does every step except the ones that leave the runner: no commit is pushed, nothing
# is uploaded, no release is created.
#
# Needs one secret, NPM_TOKEN: an npm automation token with publish rights on the
# @wiluszdamian scope. Pushing to main needs the workflow to be allowed to bypass any
# branch protection on it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, e.g. 0.9.0 or 1.0.0-rc.1 (no leading v)
        type: string
        required: true
      dry_run:
        description: Do everything except push, upload and create the release
        type: boolean
        default: true

permissions:
  contents: write # the release commit, the tag and the GitHub release
  id-token: write # npm provenance: the package says which commit and workflow built it

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: The tag must be new
        run: |
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} already exists." >&2
            exit 1
          fi

      - name: Set the version everywhere and date the changelog
        run: node scripts/release.mjs bump "$VERSION"

      - run: pnpm run build
      - name: Regenerate what follows the version (pinned MCP version, plugin manifests)
        run: pnpm run generate

      - name: The version, VERSION, changelog and every package agree
        run: node scripts/release.mjs check "v${VERSION}"

      - name: Everything verified, generated files included
        run: pnpm run verify
        env:
          CI: 'true'

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"

      - name: Publish to npm
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            pnpm -r publish --dry-run --no-git-checks --access public
          else
            pnpm -r publish --no-git-checks --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # After npm, so a failed publish leaves no tag behind that says it happened.
      - name: Push the release commit and tag
        if: inputs.dry_run != true
        run: git push origin HEAD:main "v${VERSION}"

      - name: GitHub release
        if: inputs.dry_run != true
        run: |
          node scripts/release.mjs notes "$VERSION" > release-notes.md
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "v${VERSION}" --title "Cue ${VERSION}" --notes-file release-notes.md --verify-tag $flags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
