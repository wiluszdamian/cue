name: upstream

# The integrator model trades "I cannot write fast enough" for "upstream moves
# under me". This job makes that movement visible on a schedule instead of at the
# moment a user's install breaks.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @understudy/engine run build
      # Fails, naming the tool and what to do, when the newest release of anything in
      # compatibility.yaml is outside the range it was tested against. A red scheduled
      # run already notifies whoever watches the repository, so this does not open issues
      # and needs no write permission.
      - name: Is every tool still inside its tested range?
        run: node scripts/check-upstream.mjs
      # Fails when typescript-eslint accepts TypeScript 7, which is the signal to
      # collapse the two-compiler setup back to one. See scripts/tsc7.mjs.
      - name: Is the two-TypeScript workaround still needed?
        run: node scripts/check-ts7-support.mjs
